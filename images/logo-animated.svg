<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2974.42 849.27">
  <defs>
    <style>
      .cls-1 { fill: #231f20; }
      .cls-2 { fill: #fff; }

      /* Cinematic Draw and Slide Animation */
      .bg-circle {
        transform-origin: 424.63px 424.63px;
        animation: scaleUpCircle 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      @keyframes scaleUpCircle {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .white-path {
        fill-opacity: 0;
        stroke: #fff;
        stroke-width: 3;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: 
          drawStroke 1.5s cubic-bezier(0.77, 0, 0.175, 1) 0.5s forwards,
          fadeInFill 0.8s ease 1.6s forwards;
      }

      @keyframes drawStroke {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fadeInFill {
        from { fill-opacity: 0; stroke-width: 3; }
        to { fill-opacity: 1; stroke-width: 0; }
      }

      .text-group > * {
        opacity: 0;
        transform: translateX(60px);
        animation: slideInText 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideInText {
        to { opacity: 1; transform: translateX(0); }
      }

      /* Staggering the 13 text elements */
      .text-group > :nth-child(1)  { animation-delay: 1.00s; }
      .text-group > :nth-child(2)  { animation-delay: 1.05s; }
      .text-group > :nth-child(3)  { animation-delay: 1.10s; }
      .text-group > :nth-child(4)  { animation-delay: 1.15s; }
      .text-group > :nth-child(5)  { animation-delay: 1.20s; }
      .text-group > :nth-child(6)  { animation-delay: 1.25s; }
      .text-group > :nth-child(7)  { animation-delay: 1.30s; }
      .text-group > :nth-child(8)  { animation-delay: 1.35s; }
      .text-group > :nth-child(9)  { animation-delay: 1.40s; }
      .text-group > :nth-child(10) { animation-delay: 1.45s; }
      .text-group > :nth-child(11) { animation-delay: 1.50s; }
      .text-group > :nth-child(12) { animation-delay: 1.55s; }
      .text-group > :nth-child(13) { animation-delay: 1.60s; }

    </style>
  </defs>
  
  <circle class="cls-1 bg-circle" cx="424.63" cy="424.63" r="424.63"/>
  
